[project]
name = "resurrection-protocol"
version = "0.1.0"
description = "Recovery Protocol: a git-based, Illuminae-flavoured Python learning game"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "GHOST_PROTOCOL"}]
dependencies = [
    "typer>=0.12",
    "pytest>=8",
]

[project.scripts]
recovery = "resurrection.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resurrection"]
