<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recovery Protocol — System Status Report</title>
<style>
  :root {
    --void: #000000;
    --void-lift: #1a1a1a;
    --silver: #c0c0c0;
    --green: #00aa00;
    --red: #ff3333;
    --yellow: #ffaa00;
    --purple: #6b4b9a;
    --indigo: #2a2a3e;
    --font-mono: 'Menlo', 'Monaco', 'Courier New', monospace;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --void: #f5f5f5; --void-lift: #e8e8e8; --silver: #333333;
      --green: #008000; --red: #cc0000; --yellow: #cc8800;
    }
  }
  :root[data-theme="light"] {
    --void: #f5f5f5; --void-lift: #e8e8e8; --silver: #333333;
    --green: #008000; --red: #cc0000; --yellow: #cc8800;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--void); color: var(--silver); }
  body { font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.05em; line-height: 1.6; }

  #toc {
    position: sticky; top: 0; z-index: 10; background: var(--void);
    border-bottom: 1px solid var(--indigo); padding: 10px 30px; display: flex;
    gap: 4px; align-items: center; flex-wrap: wrap; font-size: 11px;
  }
  #toc .toc-label { color: var(--silver); opacity: 0.5; margin-right: 8px; text-transform: uppercase; letter-spacing: 0.1em; }
  #toc a { color: var(--purple); text-decoration: none; padding: 5px 10px; border: 1px solid var(--indigo); }
  #toc a:hover { color: #fff; border-color: var(--purple); }

  main { max-width: 860px; margin: 0 auto; padding: 30px 30px 80px; }
  section { padding-top: 40px; scroll-margin-top: 56px; }
  section:first-of-type { padding-top: 0; }
  .section-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--indigo); padding-bottom: 8px; margin-bottom: 20px; }
  .section-head h2 { color: #fff; font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase; margin: 0; }
  .section-head .frac { color: var(--silver); font-size: 12px; }

  .hero-figure { font-size: 42px; color: var(--green); font-weight: 600; }
  .hero-sub { font-size: 11px; color: var(--silver); opacity: 0.6; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 26px; }
  .bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .bar-row .bname { width: 150px; flex: none; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
  .bar-track { flex: 1; height: 16px; background: var(--void-lift); border: 1px solid var(--indigo); position: relative; }
  .bar-fill { position: absolute; top:0; left:0; bottom:0; background: var(--green); }
  .bar-row .bfrac { width: 70px; flex: none; text-align: right; font-size: 12px; }

  .task-report { border: 1px solid var(--indigo); margin-bottom: 18px; }
  .tr-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: var(--void-lift); border-bottom: 1px solid var(--indigo); }
  .tr-head .tname { color: #fff; font-size: 13px; }
  .tag { font-size: 10px; padding: 2px 8px; border: 1px solid; letter-spacing: 0.1em; text-transform: uppercase; }
  .tag.solved { color: var(--green); border-color: var(--green); }
  .tag.unsolved { color: var(--yellow); border-color: var(--yellow); opacity: 0.8; }
  .tr-body { padding: 16px; display: flex; gap: 24px; flex-wrap: wrap; }
  .tr-chart { flex: none; }
  .chart-key { font-size: 10px; opacity: 0.6; margin-top: 4px; }
  .chart-key .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin: 0 5px 0 12px; vertical-align: middle; }
  .chart-key .dot:first-child { margin-left: 0; }
  .chart-key .dot.run { background: var(--silver); opacity: .7; }
  .chart-key .dot.best { background: var(--green); }
  .tr-history { flex: 1; min-width: 220px; }
  .tr-history table { border-collapse: collapse; width: 100%; font-size: 11px; }
  .tr-history th { text-align: left; color: var(--silver); opacity: 0.55; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 10px 4px 0; }
  .tr-history td { padding: 2px 10px 2px 0; }
  .tr-history td.best { color: var(--green); }
  .tr-empty { color: var(--silver); opacity: 0.6; font-size: 12px; padding: 4px 0; }
  .tr-empty code { color: var(--purple); opacity: 1; }

  .tr-complexity { width: 100%; font-size: 11px; opacity: 0.75; margin-top: 10px; padding-top: 10px; border-top: 1px dotted var(--indigo); }
  .tr-complexity .label { opacity: 0.6; text-transform: uppercase; letter-spacing: 0.06em; font-size: 10px; }
  .tr-complexity .val { color: #fff; }
  .tr-complexity .na { opacity: 0.5; font-style: italic; }

  .grid-line { stroke: var(--silver); stroke-opacity: 0.12; stroke-width: 1; }
  .trajectory { stroke: var(--silver); stroke-opacity: 0.35; stroke-width: 1; fill: none; stroke-dasharray: 2 3; }
  .pt-run { fill: var(--silver); opacity: 0.65; }
  .pt-best { fill: var(--green); stroke: var(--void-lift); stroke-width: 2; }
  .axis-label { fill: var(--silver); opacity: 0.55; font-size: 8px; font-family: var(--font-mono); }

  .tooltip { position: fixed; pointer-events: none; background: var(--void-lift); border: 1px solid var(--purple); padding: 6px 9px; font-size: 11px; color: var(--silver); z-index: 50; line-height: 1.4; }
  .tooltip .v { color: #fff; font-weight: bold; }
  .tooltip[hidden] { display: none; }

  .empty-page { padding: 60px 30px; text-align: center; color: var(--silver); opacity: 0.6; }
  .empty-page code { color: var(--purple); opacity: 1; }

  footer { text-align: center; font-size: 11px; opacity: 0.4; padding: 20px 0 40px; }
  footer a { color: var(--purple); text-decoration: none; }
</style>
</head>
<body>
<nav id="toc">
  <span class="toc-label">jump to</span>
  <a href="#overview">Overview</a>
  <span id="tocModules"></span>
</nav>

<main id="main">
  <section id="overview">
    <div class="section-head"><h2>System Status Report</h2><span class="frac" id="generatedAt"></span></div>
    <div class="hero-figure" id="heroFigure">—</div>
    <div class="hero-sub">tasks recovered across all modules</div>
    <div id="bars"></div>
  </section>
  <div id="moduleSections"></div>
</main>

<footer><a href="/">← back to recovery terminal</a></footer>

<div class="tooltip" id="tooltip" hidden></div>

<script>
function runObjs(raw) {
    return raw.slice().sort((a, b) => new Date(a.recorded) - new Date(b.recorded));
}
function bestRun(runs) {
    return runs.reduce((b, r) => r.time_ms_best < b.time_ms_best ? r : b, runs[0]);
}

function buildScatter(runs) {
    const w = 260, h = 150, pad = { l: 36, r: 10, t: 10, b: 22 };
    const innerW = w - pad.l - pad.r, innerH = h - pad.t - pad.b;
    const maxSize = Math.max(...runs.map(r => r.size_lines)) * 1.2 || 1;
    const maxTime = Math.max(...runs.map(r => r.time_ms_best)) * 1.2 || 1;
    const x = v => pad.l + (v / maxSize) * innerW;
    const y = v => pad.t + innerH - (v / maxTime) * innerH;
    const best = bestRun(runs);

    let svg = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">`;
    for (let i = 0; i <= 4; i++) {
        const gx = pad.l + innerW * i / 4, gy = pad.t + innerH * i / 4;
        svg += `<line x1="${gx}" y1="${pad.t}" x2="${gx}" y2="${pad.t + innerH}" class="grid-line"/>`;
        svg += `<line x1="${pad.l}" y1="${gy}" x2="${pad.l + innerW}" y2="${gy}" class="grid-line"/>`;
    }
    svg += `<text x="${pad.l}" y="${h - 6}" class="axis-label">0</text>`;
    svg += `<text x="${pad.l + innerW}" y="${h - 6}" class="axis-label" text-anchor="end">${Math.round(maxSize)} ln</text>`;
    svg += `<text x="${pad.l - 4}" y="${pad.t + innerH}" class="axis-label" text-anchor="end">0</text>`;
    svg += `<text x="${pad.l - 4}" y="${pad.t + 8}" class="axis-label" text-anchor="end">${maxTime.toFixed(1)}ms</text>`;
    const pts = runs.map(r => `${x(r.size_lines)},${y(r.time_ms_best)}`).join(' ');
    svg += `<polyline points="${pts}" class="trajectory"/>`;
    runs.forEach((r, i) => {
        const cx = x(r.size_lines), cy = y(r.time_ms_best);
        const isBest = r === best;
        svg += `<circle cx="${cx}" cy="${cy}" r="${isBest ? 6 : 4}" class="${isBest ? 'pt-best' : 'pt-run'}"/>`;
        svg += `<circle cx="${cx}" cy="${cy}" r="13" fill="transparent" class="hit" data-i="${i}"/>`;
    });
    svg += `</svg>`;
    return { svg, best };
}

function wireTooltips(container, runs, best) {
    const tt = document.getElementById('tooltip');
    container.querySelectorAll('.hit').forEach(el => {
        const r = runs[+el.dataset.i];
        el.addEventListener('mousemove', e => {
            tt.hidden = false;
            const when = r.recorded ? new Date(r.recorded).toLocaleString() : '';
            tt.innerHTML = `<div>${when}${r === best ? ' — <span class="v" style="color:var(--green)">BEST</span>' : ''}</div>` +
                `<div>time <span class="v">${r.time_ms_best.toFixed(2)}ms</span> best / ${r.time_ms_median.toFixed(2)}ms median</div>` +
                `<div>size <span class="v">${r.size_lines} lines</span></div>`;
            tt.style.left = (e.clientX + 14) + 'px';
            tt.style.top = (e.clientY + 14) + 'px';
        });
        el.addEventListener('mouseleave', () => { tt.hidden = true; });
    });
}

function renderTask(moduleId, taskId, runs) {
    const card = document.createElement('div');
    card.className = 'task-report';
    if (runs.length) {
        const sorted = runObjs(runs);
        const { svg, best } = buildScatter(sorted);
        const rowsHtml = sorted.map(r => {
            const when = r.recorded ? new Date(r.recorded).toLocaleDateString() : '';
            return `<tr><td>${when}</td><td${r === best ? ' class="best"' : ''}>${r.time_ms_best.toFixed(2)}ms</td><td>${r.size_lines} ln</td></tr>`;
        }).join('');
        const latest = sorted[sorted.length - 1];
        const complexityHtml = (latest.time_class || latest.space_class)
            ? `<span class="label">time</span> <span class="val">${latest.time_class || '—'}</span>
               &nbsp;&nbsp;<span class="label">space</span> <span class="val">${latest.space_class || '—'}</span>`
            : `<span class="na">no complexity estimate - this task has no size-scaling benchmark</span>`;
        const bonusHtml = sorted.some(r => r.no_imports_bonus)
            ? ' &nbsp;&nbsp;<span class="val" style="color:var(--green)">⭐ no imports</span>'
            : '';

        card.innerHTML = `
            <div class="tr-head"><span class="tname">${taskId}</span><span class="tag solved">solved — ${sorted.length} run${sorted.length === 1 ? '' : 's'}</span></div>
            <div class="tr-body">
                <div class="tr-chart">${svg}<div class="chart-key"><span class="dot run"></span>run<span class="dot best"></span>best</div></div>
                <div class="tr-history"><table><tr><th>recorded</th><th>time (best)</th><th>size</th></tr>${rowsHtml}</table></div>
                <div class="tr-complexity">${complexityHtml}${bonusHtml}</div>
            </div>`;
        document.getElementById('moduleSections').lastElementChild.querySelector('[data-tasks]').appendChild(card);
        wireTooltips(card, sorted, best);
    } else {
        card.innerHTML = `
            <div class="tr-head"><span class="tname">${taskId}</span><span class="tag unsolved">unsolved</span></div>
            <div class="tr-body"><div class="tr-empty">NO BENCHMARK DATA — solve it, then run <code>recovery performance ${moduleId}/${taskId}</code> locally.</div></div>`;
        document.getElementById('moduleSections').lastElementChild.querySelector('[data-tasks]').appendChild(card);
    }
}

function renderModule(mod, runsByTask) {
    const solved = mod.tasks.filter(t => (runsByTask[t] || []).length > 0).length;
    const section = document.createElement('section');
    section.id = mod.id;
    section.innerHTML = `
        <div class="section-head"><h2>Module: ${mod.id}</h2><span class="frac">${solved} / ${mod.tasks.length} solved</span></div>
        <div data-tasks></div>`;
    document.getElementById('moduleSections').appendChild(section);
    mod.tasks.forEach(taskId => renderTask(mod.id, taskId, runsByTask[taskId] || []));
}

function renderBars(modules, runsByModuleTask) {
    const wrap = document.getElementById('bars');
    modules.forEach(mod => {
        const solved = mod.tasks.filter(t => (runsByModuleTask[mod.id][t] || []).length > 0).length;
        const row = document.createElement('div');
        row.className = 'bar-row';
        const pct = mod.tasks.length ? (solved / mod.tasks.length) * 100 : 0;
        row.innerHTML = `<span class="bname">${mod.id}</span>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
            <span class="bfrac">${solved}/${mod.tasks.length}</span>`;
        wrap.appendChild(row);
    });
}

async function main() {
    document.getElementById('generatedAt').textContent = 'generated ' + new Date().toLocaleString();

    let roster, performance;
    try {
        [roster, performance] = await Promise.all([
            fetch('/roster').then(r => r.json()),
            fetch('/performance').then(r => r.json()),
        ]);
    } catch (err) {
        document.getElementById('main').innerHTML =
            '<div class="empty-page">Could not reach the recovery server.<br>Is the container running?</div>';
        return;
    }

    const modules = roster.modules || [];
    if (modules.length === 0) {
        document.getElementById('main').innerHTML =
            '<div class="empty-page">No modules found yet.<br>Clone the modules repository into the server first.</div>';
        return;
    }

    const runsByModuleTask = {};
    let totalSolved = 0, totalTasks = 0;
    modules.forEach(mod => {
        runsByModuleTask[mod.id] = {};
        mod.tasks.forEach(taskId => { runsByModuleTask[mod.id][taskId] = []; });
        totalTasks += mod.tasks.length;
    });
    (performance.runs || []).forEach(r => {
        if (runsByModuleTask[r.module] && runsByModuleTask[r.module][r.task] !== undefined) {
            runsByModuleTask[r.module][r.task].push(r);
        }
    });
    modules.forEach(mod => {
        totalSolved += mod.tasks.filter(t => runsByModuleTask[mod.id][t].length > 0).length;
    });

    document.getElementById('heroFigure').textContent = `${totalSolved} / ${totalTasks}`;

    const tocModules = document.getElementById('tocModules');
    modules.forEach(mod => {
        const a = document.createElement('a');
        a.href = '#' + mod.id;
        a.textContent = mod.id;
        tocModules.appendChild(a);
    });

    renderBars(modules, runsByModuleTask);
    modules.forEach(mod => renderModule(mod, runsByModuleTask[mod.id]));
}

main();
</script>
</body>
</html>
